name: Cross-Compile for Android AArch64 (Bionic-compatible)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26d # you can choose another version if needed
        add-to-path: true

    - name: Configure CMake with Android NDK
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a
        -DANDROID_PLATFORM=android-24

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Check binary
      run: file build/metadata

    - name: Upload Android AArch64 Binary
      uses: actions/upload-artifact@v4
      with:
        name: metadata-android-arm64
        path: build/metadata
